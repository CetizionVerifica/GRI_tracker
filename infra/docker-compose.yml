# Local development services. Credentials are dev-only defaults; override via environment.
name: gri-kpi

x-minio-image: &minio-image
  # Community build of MinIO (upstream stopped publishing images). Pin a release tag.
  image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gri}
      POSTGRES_DB: ${POSTGRES_DB:-gri}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"  # non-default port avoids clashing with a native Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gri} -d ${POSTGRES_DB:-gri}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    <<: *minio-image
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-dev-password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: creates the application bucket once MinIO is healthy, then exits.
  minio-init:
    <<: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-dev-password}
      S3_BUCKET: ${S3_BUCKET:-gri-kpi}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
