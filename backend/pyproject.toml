[project]
name = "gri-kpi-backend"
version = "0.1.0"
description = "Multi-tenant backend for GRI KPI data collection, approval, calculation and reporting."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "testcontainers[minio,postgres,redis]>=4.15.0",
    "types-aiobotocore[s3]~=2.25.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "S",       # bandit
    "C4",      # comprehensions
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "DTZ",     # timezone-aware datetimes
    "T20",     # no print
    "PT",      # pytest style
    "ASYNC",   # async pitfalls
    "TID",     # tidy imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["aioboto3"]  # untyped; the S3 client itself is typed via types-aiobotocore-s3
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: test needs real services (PostgreSQL, Redis, MinIO via testcontainers)"]
addopts = "--strict-markers"
