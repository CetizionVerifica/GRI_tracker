    description: GRI 102-5-c.
    data_type: decimal
    unit: t
    requirement: required
    validation:
      minimum: '0'
  - code: gri102_2025.5.d.base_year
    name: Base year
    description: GRI 102-5-d.
    data_type: text
    requirement: required
  - code: gri102_2025.5.d.i.base_year_rationale
    name: Rationale for choosing the base year
    description: GRI 102-5-d-i.
    data_type: text
    requirement: required
  - code: gri102_2025.5.d.ii.base_year_emissions
    name: Base-year emissions
    description: GRI 102-5-d-ii.
    data_type: decimal
    unit: t CO2e
    requirement: required
    validation:
      minimum: '0'
  - code: gri102_2025.5.d.ii.base_year_biogenic_co2
    name: Base-year biogenic CO2 emissions
    description: GRI 102-5-d-ii.
    data_type: decimal
    unit: t
    requirement: required
    validation:
      minimum: '0'
  - code: gri102_2025.5.d.iii.recalculation_context
    name: Context for significant changes that triggered base-year recalculation
    description: GRI 102-5-d-iii.
    data_type: text
    requirement: required_if_applicable
  - code: gri102_2025.5.d.iv.previous_base_year_emissions
    name: Previously reported base-year emissions (if recalculated)
    description: GRI 102-5-d-iv.
    data_type: decimal
    unit: t CO2e
    requirement: required_if_applicable
    validation:
      minimum: '0'
  - code: gri102_2025.5.e.consolidation_approach
    name: Consolidation approach
    description: GRI 102-5-e.
    data_type: choice
    requirement: required
    validation:
      choices: &id001
      - equity_share
      - financial_control
      - operational_control
  - code: gri102_2025.5.f.methodology
    name: Standards, methodologies, assumptions, tools and emission factors
    description: GRI 102-5-f.
    data_type: text
    requirement: required
