- code: 2-21
  title: Annual total compensation ratio
  metrics:
  - code: gri2_2021.21.a.highest_paid_compensation
    name: Annual total compensation of the highest-paid individual
    description: GRI 2-21-a. Input to a calculated metric in this disclosure. Amount in the organization's
      reporting currency.
    data_type: decimal
    unit: currency_unit
    requirement: required
    validation:
      minimum: '0'
  - code: gri2_2021.21.a.median_compensation
    name: Median annual total compensation of all other employees
    description: GRI 2-21-a. Input to a calculated metric in this disclosure. Amount in the organization's
      reporting currency.
    data_type: decimal
    unit: currency_unit
    requirement: required
    validation:
      minimum: '0'
  - code: gri2_2021.21.b.highest_paid_increase
    name: Percentage increase in compensation of the highest-paid individual
    description: GRI 2-21-b. Input to a calculated metric in this disclosure.
    data_type: decimal
    unit: percent
    requirement: required
  - code: gri2_2021.21.b.median_increase
    name: Median percentage increase in compensation of all other employees
    description: GRI 2-21-b. Input to a calculated metric in this disclosure.
    data_type: decimal
    unit: percent
    requirement: required
  - code: gri2_2021.21.a.total_compensation_ratio
    name: Highest-paid individual to median employee annual total compensation
    description: GRI 2-21-a. Calculated by the calculation module; never entered by hand.
    data_type: decimal
    unit: dimensionless
    requirement: required
    validation:
      minimum: '0'
    calculated: true
  - code: gri2_2021.21.b.compensation_increase_ratio
    name: Ratio of percentage increases in annual total compensation
    description: GRI 2-21-b. Calculated by the calculation module; never entered by hand.
    data_type: decimal
    unit: dimensionless
    requirement: required
    calculated: true
  - code: gri2_2021.21.c.context
    name: Contextual information and how the data were compiled
    description: GRI 2-21-c.
    data_type: text
    requirement: required
