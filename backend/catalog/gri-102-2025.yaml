    description: GRI 102-5-b.
    data_type: decimal
    unit: t
    requirement: required
    validation:
      minimum: '0'
    dimensions:
    - code: ghg_gas
      required: true
  - code: gri102_2025.5.b.scope1_by_gas_co2e
    name: Gross Scope 1 emissions by gas (CO2e)
    description: GRI 102-5-b.
    data_type: decimal
    unit: t CO2e
    requirement: required
