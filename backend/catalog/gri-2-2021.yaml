# GRI catalog content, reviewed and approved on 2026-09-26.
# Drafted from the requirement sections of the GRI Standards PDFs; names paraphrase GRI.
standard:
  code: GRI 2
  title: General Disclosures
  version: '2021'
  effective_date: 2023-01-01
disclosures:
- code: 2-1
  title: Organizational details
  metrics:
  - code: gri2_2021.1.a.legal_name
    name: Legal name
    description: GRI 2-1-a.
    data_type: text
    requirement: required
  - code: gri2_2021.1.b.ownership_legal_form
    name: Nature of ownership and legal form
    description: GRI 2-1-b.
    data_type: text
    requirement: required
  - code: gri2_2021.1.c.headquarters_location
    name: Location of headquarters
    description: GRI 2-1-c.
    data_type: text
    requirement: required
  - code: gri2_2021.1.d.countries_of_operation
    name: Countries of operation
    description: GRI 2-1-d.
    data_type: text
    requirement: required
- code: 2-2
  title: Entities included in the organization’s sustainability reporting
  metrics:
  - code: gri2_2021.2.a.entities_included
    name: Entities included in sustainability reporting
    description: GRI 2-2-a.
    data_type: text
    requirement: required
  - code: gri2_2021.2.b.differences_from_financial_reporting
    name: Differences between entities in financial and sustainability reporting
    description: GRI 2-2-b.
    data_type: text
    requirement: required_if_applicable
  - code: gri2_2021.2.c.consolidation_approach
    name: Approach used for consolidating information
    description: GRI 2-2-c.
    data_type: text
    requirement: required_if_applicable
- code: 2-3
  title: Reporting period, frequency and contact point
  metrics:
  - code: gri2_2021.3.a.reporting_period_frequency
    name: Sustainability reporting period and frequency
    description: GRI 2-3-a.
    data_type: text
    requirement: required
  - code: gri2_2021.3.b.financial_reporting_period
    name: Financial reporting period and any misalignment
    description: GRI 2-3-b.
    data_type: text
    requirement: required
  - code: gri2_2021.3.c.publication_date
    name: Publication date of the report
    description: GRI 2-3-c.
    data_type: date
    requirement: required
  - code: gri2_2021.3.d.contact_point
    name: Contact point for questions about the report
    description: GRI 2-3-d.
    data_type: text
    requirement: required
- code: 2-4
  title: Restatements of information
  metrics:
  - code: gri2_2021.4.a.restatements
    name: Restatements, with reasons and effect
    description: GRI 2-4-a.
    data_type: text
    requirement: required
- code: 2-5
  title: External assurance
  metrics:
  - code: gri2_2021.5.a.assurance_policy
    name: Policy and practice for seeking external assurance
    description: GRI 2-5-a.
    data_type: text
    requirement: required
  - code: gri2_2021.5.b.assurance_details
    name: Assurance report link, scope, basis and provider relationship
    description: GRI 2-5-b.
    data_type: text
    requirement: required_if_applicable
- code: 2-6
  title: Activities, value chain and other business relationships
  metrics:
  - code: gri2_2021.6.a.sectors
    name: Sectors in which the organization is active
    description: GRI 2-6-a.
    data_type: text
    requirement: required
  - code: gri2_2021.6.b.value_chain
    name: Value chain description
    description: GRI 2-6-b.
    data_type: text
    requirement: required
  - code: gri2_2021.6.c.other_business_relationships
    name: Other relevant business relationships
    description: GRI 2-6-c.
    data_type: text
    requirement: required
  - code: gri2_2021.6.d.significant_changes
    name: Significant changes compared to the previous period
    description: GRI 2-6-d.
    data_type: text
    requirement: required
- code: 2-7
  title: Employees
  metrics:
  - code: gri2_2021.7.a.employees
    name: Employees
    description: GRI 2-7-a. Decimal so FTE-based figures are possible.
    data_type: decimal
    unit: count
    requirement: required
    validation:
      minimum: '0'
    dimensions:
    - code: gender
      required: true
    - code: region
      required: true
  - code: gri2_2021.7.b.i.permanent_employees
    name: Permanent employees
    description: GRI 2-7-b-i. Decimal so FTE-based figures are possible.
    data_type: decimal
    unit: count
    requirement: required
    validation:
      minimum: '0'
    dimensions:
    - code: gender
      required: true
    - code: region
      required: true
  - code: gri2_2021.7.b.ii.temporary_employees
    name: Temporary employees
    description: GRI 2-7-b-ii. Decimal so FTE-based figures are possible.
    data_type: decimal
    unit: count
    requirement: required
    validation:
      minimum: '0'
    dimensions:
    - code: gender
      required: true
    - code: region
      required: true
  - code: gri2_2021.7.b.iii.non_guaranteed_hours_employees
    name: Non-guaranteed hours employees
    description: GRI 2-7-b-iii. Decimal so FTE-based figures are possible.
    data_type: decimal
    unit: count
    requirement: required
    validation:
      minimum: '0'
    dimensions:
    - code: gender
      required: true
    - code: region
      required: true
  - code: gri2_2021.7.b.iv.full_time_employees
    name: Full-time employees
    description: GRI 2-7-b-iv. Decimal so FTE-based figures are possible.
    data_type: decimal
    unit: count
    requirement: required
    validation:
      minimum: '0'
    dimensions:
    - code: gender
      required: true
    - code: region
      required: true
  - code: gri2_2021.7.b.v.part_time_employees
    name: Part-time employees
    description: GRI 2-7-b-v. Decimal so FTE-based figures are possible.
    data_type: decimal
    unit: count
    requirement: required
    validation:
      minimum: '0'
    dimensions:
    - code: gender
      required: true
    - code: region
      required: true
  - code: gri2_2021.7.c.i.counting_unit
    name: Reported in head count, FTE or another methodology
    description: GRI 2-7-c-i.
    data_type: choice
    requirement: required
    validation:
      choices:
      - head_count
      - fte
      - other
  - code: gri2_2021.7.c.ii.counting_point
    name: Reported at period end, as an average, or otherwise
    description: GRI 2-7-c-ii.
    data_type: choice
    requirement: required
    validation:
      choices:
      - end_of_period
      - average
      - other
  - code: gri2_2021.7.c.methodology
    name: Methodologies and assumptions used
    description: GRI 2-7-c.
    data_type: text
    requirement: required
  - code: gri2_2021.7.d.context
    name: Contextual information for 2-7-a and 2-7-b
    description: GRI 2-7-d.
    data_type: text
    requirement: required
  - code: gri2_2021.7.e.fluctuations
    name: Significant fluctuations in the number of employees
    description: GRI 2-7-e.
    data_type: text
    requirement: required
- code: 2-8
  title: Workers who are not employees
  metrics:
  - code: gri2_2021.8.a.non_employee_workers
    name: Workers who are not employees (work controlled)
    description: GRI 2-8-a. Decimal so FTE-based figures are possible.
    data_type: decimal
    unit: count
    requirement: required
    validation:
      minimum: '0'
  - code: gri2_2021.8.a.i.worker_types
    name: Most common worker types, contractual relationship, and work
    description: GRI 2-8-a-i.
    data_type: text
    requirement: required
  - code: gri2_2021.8.b.i.counting_unit
    name: Reported in head count, FTE or another methodology
    description: GRI 2-8-b-i.
    data_type: choice
    requirement: required
    validation:
      choices:
      - head_count
      - fte
      - other
  - code: gri2_2021.8.b.ii.counting_point
    name: Reported at period end, as an average, or otherwise
    description: GRI 2-8-b-ii.
    data_type: choice
    requirement: required
    validation:
      choices:
      - end_of_period
      - average
      - other
  - code: gri2_2021.8.b.methodology
    name: Methodologies and assumptions used
    description: GRI 2-8-b.
    data_type: text
    requirement: required
  - code: gri2_2021.8.c.fluctuations
    name: Significant fluctuations in the number of such workers
    description: GRI 2-8-c.
    data_type: text
    requirement: required
- code: 2-9
  title: Governance structure and composition
  metrics:
  - code: gri2_2021.9.a.governance_structure
    name: Governance structure, including committees
    description: GRI 2-9-a.
    data_type: text
    requirement: required
  - code: gri2_2021.9.b.impact_committees
    name: Committees responsible for managing impacts
    description: GRI 2-9-b.
    data_type: text
    requirement: required
  - code: gri2_2021.9.c.composition
    name: Composition of the highest governance body and its committees
    description: GRI 2-9-c.
    data_type: text
    requirement: required
- code: 2-10
  title: Nomination and selection of the highest governance body
  metrics:
  - code: gri2_2021.10.a.nomination_process
    name: Nomination and selection processes
    description: GRI 2-10-a.
    data_type: text
    requirement: required
  - code: gri2_2021.10.b.nomination_criteria
    name: Criteria used for nominating and selecting members
    description: GRI 2-10-b.
    data_type: text
    requirement: required
- code: 2-11
  title: Chair of the highest governance body
  metrics:
  - code: gri2_2021.11.a.chair_is_senior_executive
    name: Chair is also a senior executive
