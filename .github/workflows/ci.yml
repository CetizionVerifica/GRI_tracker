name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16  # keep in sync with infra/docker-compose.yml
        env:
          POSTGRES_USER: gri
          POSTGRES_PASSWORD: gri
          POSTGRES_DB: gri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gri -d gri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Postgres comes from the service above; Redis and MinIO still start via testcontainers.
      TEST_DATABASE_URL: postgresql+psycopg://gri:gri@localhost:5432/gri_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Audit the exact locked versions (including dev deps), hash-pinned, without installing.
      - run: uv export --frozen --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
