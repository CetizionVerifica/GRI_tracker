    data_type: integer
    unit: count
    requirement: required
    validation:
      minimum: '0'
  - code: gri2_2021.16.b.critical_concerns_nature
    name: Nature of the critical concerns communicated
    description: GRI 2-16-b.
    data_type: text
    requirement: required
- code: 2-17
  title: Collective knowledge of the highest governance body
  metrics:
  - code: gri2_2021.17.a.knowledge_measures
