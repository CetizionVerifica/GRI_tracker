    name: Highest governance body reviews and approves reported information
    description: GRI 2-14-a.
    data_type: boolean
    requirement: required
  - code: gri2_2021.14.a.review_process
    name: Process for reviewing and approving the information
    description: GRI 2-14-a.
    data_type: text
    requirement: required_if_applicable
  - code: gri2_2021.14.b.reason_not_responsible
    name: Reason the body is not responsible
    description: GRI 2-14-b.
    data_type: text
    requirement: required_if_applicable
- code: 2-15
  title: Conflicts of interest
  metrics:
  - code: gri2_2021.15.a.prevention_processes
    name: Processes to prevent and mitigate conflicts of interest
    description: GRI 2-15-a.
    data_type: text
    requirement: required
  - code: gri2_2021.15.b.disclosure_to_stakeholders
    name: Whether conflicts of interest are disclosed to stakeholders
    description: GRI 2-15-b.
    data_type: text
    requirement: required
- code: 2-16
  title: Communication of critical concerns
  metrics:
  - code: gri2_2021.16.a.communication_process
    name: Whether and how critical concerns are communicated
    description: GRI 2-16-a.
    data_type: text
    requirement: required
  - code: gri2_2021.16.b.critical_concerns
    name: Critical concerns communicated to the body
